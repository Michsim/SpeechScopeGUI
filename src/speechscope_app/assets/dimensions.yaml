# Dimenze řeči pro srovnání s normou (pavouk) a jejich položky.
# direction: higher = vyšší hodnota je horší, lower = nižší je horší,
# both = odchylka na kteroukoli stranu je horší (z-skóre v absolutní hodnotě).
# log: true = z-skóre po logaritmu (šikmé rozdělení: pauzy, VOT).
format: 1

dimensions:
  - key: voice
    name: Kvalita hlasu
    name_en: Voice quality
    items:
      - column: acoustic.quality.perturbation.hnr
        tasks: [phonation]
        direction: lower
      - column: acoustic.quality.cpp.cpp
        tasks: [phonation]
        direction: lower
      - column: acoustic.quality.cpp.cpp
        tasks: [spontaneous]
        direction: lower

  - key: articulation
    name: Artikulace
    name_en: Articulation
    items:
      - column: acoustic.ddk.vot.median
        tasks: [ddk]
        direction: higher
      - column: acoustic.articulation.vowels.FRI
        tasks: [spontaneous, reading]
        direction: lower
      - column: acoustic.ddk.regularity
        tasks: [ddk]
        direction: higher
        log: true
      #- column: acoustic.ddk.intensity.rirv
      #  tasks: [ddk]
      #  direction: lower

  - key: tempo
    name: Tempo řeči
    name_en: Speech tempo
    items:
      - column: acoustic.ddk.rate
        tasks: [ddk]
        direction: both  # zpomalené i zrychlené (festinace) tempo je patologické
      - column: acoustic.timing.speech_rate.articulation_rate
        tasks: [spontaneous, reading]
        direction: both

  - key: pauses
    name: Pauzy
    name_en: Pauses
    items:
      - column: acoustic.timing.pauses.median
        tasks: [spontaneous, reading]
        direction: higher
        log: true

  - key: prosody
    name: Prozódie
    name_en: Prosody
    items:
      - column: acoustic.pitch.f0.std
        tasks: [reading, spontaneous]
        direction: lower
      - column: acoustic.intensity.stats.std
        tasks: [reading, spontaneous]
        direction: lower

  - key: breathing
    name: Dýchání
    name_en: Breathing
    items:
      - column: acoustic.timing.breaths.per_minute
        tasks: [spontaneous, reading]
        direction: both
      - column: acoustic.timing.breaths.median
        tasks: [spontaneous, reading]
        direction: both
        log: true

  - key: syntax
    name: Syntax
    name_en: Syntax
    items:
      - column: linguistic.syntactic.mlu  # průměrná délka výpovědi
        tasks: [spontaneous]
        direction: lower
      - column: linguistic.syntactic.sdl  # vzdálenost řídící–závislé slovo
        tasks: [spontaneous]
        direction: lower
      - column: linguistic.syntactic.csr  # vedlejší věty (souřadné i podřadné) na výpověď
        tasks: [spontaneous]
        direction: lower

  - key: lexicon
    name: Slovní zásoba
    name_en: Vocabulary
    items:
      - column: linguistic.lexical.mattr  # lexikální diverzita
        tasks: [spontaneous]
        direction: lower
      - column: linguistic.lexical.ngrams  # opakování frází
        tasks: [spontaneous]
        direction: higher
      - column: linguistic.lexical.content_density
        tasks: [spontaneous]
        direction: lower
